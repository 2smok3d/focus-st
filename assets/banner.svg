<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Focus ST Digital Garage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff2b38"/>
      <stop offset="1" stop-color="#e8000d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 60) rotate(35) scale(520 420)">
      <stop stop-color="#e8000d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e8000d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>

  <!-- corner brackets -->
  <g stroke="#e8000d" stroke-width="2" fill="none" opacity="0.9">
    <path d="M44 40 h34 M44 40 v34"/>
    <path d="M1236 40 h-34 M1236 40 v34"/>
    <path d="M44 300 h34 M44 300 v-34"/>
    <path d="M1236 300 h-34 M1236 300 v-34"/>
  </g>

  <!-- racing stripe -->
  <rect x="90" y="86" width="6" height="168" rx="3" fill="url(#red)"/>

  <!-- telemetry sparkline -->
  <polyline points="812,208 852,208 872,150 900,236 928,120 956,190 984,168 1012,208 1180,208"
    fill="none" stroke="#e8000d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <line x1="812" y1="238" x2="1180" y2="238" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="812" y1="118" x2="1180" y2="118" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- eyebrow -->
  <text x="122" y="106" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="17" letter-spacing="7" fill="#8a8a95">2017 · 2.0L ECOBOOST · MT82</text>

  <!-- wordmark -->
  <text x="120" y="196" font-family="'Chakra Petch','Rajdhani',ui-sans-serif,system-ui,sans-serif" font-size="104" font-weight="700" letter-spacing="-1" fill="#f4f4f6">FOCUS <tspan fill="url(#red)">ST</tspan></text>

  <!-- subtitle -->
  <text x="124" y="248" font-family="'Chakra Petch',ui-sans-serif,system-ui,sans-serif" font-size="25" font-weight="600" letter-spacing="9" fill="#a2a2ad">DIGITAL&#160;&#160;GARAGE</text>

  <!-- tagline -->
  <text x="124" y="286" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" letter-spacing="2" fill="#63636e">PWA · GitHub-backed database · Postgres/FastAPI/MCP truth store · Obsidian vault</text>

  <!-- VIN chip -->
  <g>
    <rect x="812" y="96" width="368" height="30" rx="15" fill="#141416" stroke="#2e2e35"/>
    <circle cx="832" cy="111" r="4" fill="#35c46a"/>
    <text x="848" y="116" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" letter-spacing="2" fill="#a2a2ad">VIN 1FADP3L94HL223134 · PHOENIX AZ</text>
  </g>
</svg>
