services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: garage
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage
    volumes: [garage_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U garage -d garage"]
      interval: 5s
      timeout: 3s
      retries: 20
  garage:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
      - ./runtime-data:/data
    env_file: .env
    command: sh -c "pip install -e . && python -m garage.db_init && uvicorn garage.api:app --host 0.0.0.0 --port 8080"
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  garage_pg:
