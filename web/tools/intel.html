<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vehicle Intelligence — The Garage</title>
<link rel="stylesheet" href="../assets/hud.css">
<style>
  [hidden] { display: none !important; }   /* beat .kpis/.panels display:grid when toggled off */
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 16px 64px; }
  .head { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin: 8px 0 14px; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin: 0 0 16px; }
  .search { flex:1; min-width:220px; display:flex; align-items:center; gap:8px; background:var(--panel);
            border:1px solid var(--line); border-radius:var(--radius); padding:8px 12px; }
  .search input { flex:1; background:transparent; border:0; color:var(--ink,#eee); font-family:var(--mono);
                  font-size:13px; outline:none; }
  .search .k { font-family:var(--mono); font-size:11px; color:var(--muted,#8a8a92); }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .tab { font-family:var(--mono); font-size:12px; letter-spacing:.03em; text-transform:uppercase; cursor:pointer;
         padding:5px 12px; border:1px solid var(--line); border-radius:20px; color:var(--muted,#8a8a92);
         background:var(--panel); user-select:none; }
  .tab[aria-selected="true"] { border-color:var(--red,#e8000d); color:var(--ink,#eee); }
  .kpis { display:grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:18px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; }
  .kpi b { font-family:var(--disp); font-size:26px; display:block; line-height:1.1; }
  .kpi span { color:var(--muted, #8a8a92); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .panels { display:grid; grid-template-columns: repeat(auto-fit,minmax(320px,1fr)); gap:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; }
  .panel h2 { font-family:var(--disp); font-size:15px; letter-spacing:.04em; margin:0 0 10px; text-transform:uppercase; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .tag { font-family:var(--mono); font-size:11px; color:var(--muted,#8a8a92); }
  .bar { height:8px; border-radius:6px; background:#2a2a30; overflow:hidden; }
  .bar > i { display:block; height:100%; }
  .chip { font-family:var(--mono); font-size:11px; padding:2px 7px; border:1px solid var(--line); border-radius:20px; }
  a.crumb { color:var(--muted,#8a8a92); text-decoration:none; font-family:var(--mono); font-size:12px; }
  .stamp { color:var(--muted,#8a8a92); font-family:var(--mono); font-size:11px; }
  .warn { color: var(--amber, #e8a33d); } .crit { color: var(--red, #e8000d); } .ok { color: var(--green, #29c07a); }
  .results { display:flex; flex-direction:column; gap:8px; }
  .result { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line);
            border-radius:11px; padding:10px 13px; text-decoration:none; color:var(--ink,#eee); cursor:pointer; }
  .result .b { font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; padding:2px 6px;
               border:1px solid var(--line2,#2a2a30); border-radius:5px; color:var(--muted,#8a8a92); flex:none; width:52px; text-align:center; }
  .result .t { flex:1; font-size:13px; } .result .t .s { font-family:var(--mono); font-size:11px; color:var(--muted,#8a8a92); margin-top:2px; }
  .nav-panel { grid-column: 1 / -1; }
  .nav-legend { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .nav-legend .chip { cursor:pointer; user-select:none; display:inline-flex; align-items:center; gap:6px; }
  .nav-legend .chip[aria-pressed="false"] { opacity:.4; }
  .nav-legend .chip i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .nav-grid { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  .nav-map { flex:2 1 340px; min-width:280px; }
  .nav-map svg { width:100%; height:auto; display:block; }
  .nav-side { flex:1 1 220px; min-width:200px; }
  .nav-node circle { cursor:pointer; transition:opacity .1s; }
  .nav-node text { font-family:var(--mono); font-size:9px; fill:var(--ink,#e8e8ea); pointer-events:none; }
  .nav-node.dim { opacity:.25; }
  .nav-node.sel circle { stroke:var(--red,#e8000d); stroke-width:2.5; }
  .nav-edge { transition:opacity .1s; }
  .nav-edge.off { opacity:.06; }
  .nav-detail .row .tag.v { padding:1px 6px; border:1px solid var(--line); border-radius:5px; }
</style>
</head>
<body class="hud">
  <div class="wrap">
    <a class="crumb" href="../index.html">← The Garage</a>
    <div class="head">
      <div>
        <div class="eyebrow">Vehicle Intelligence</div>
        <h1 id="title" class="disp" style="margin:2px 0 0;font-family:var(--disp);font-size:30px;">Loading…</h1>
      </div>
      <div style="text-align:right">
        <div id="fleet" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:4px"></div>
        <div class="stamp" id="stamp"></div>
      </div>
    </div>

    <div class="toolbar">
      <label class="search"><span class="k">⌕</span>
        <input id="q" type="search" placeholder="Search claims, components, DTC codes…" autocomplete="off" aria-label="Universal search">
      </label>
    </div>
    <div id="tabs" class="tabs" role="tablist"></div>

    <div id="kpis" class="kpis"></div>
    <div id="panels" class="panels"></div>
    <div id="results" class="results" hidden></div>
    <p id="err" class="empty" hidden></p>
  </div>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (t, cls, html) => { const e = document.createElement(t); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const gradeColor = g => ({VEHICLE_VERIFIED:'var(--green,#29c07a)', OEM_VERIFIED:'var(--blue,#4f9dff)', CORROBORATED:'var(--amber,#e8a33d)', UNVERIFIED:'#6a6a72'}[g] || '#6a6a72');

const FLEET = ['focus-st','zzr600','rz350','tz250','toyota-pickup'];
const NAMES = {'focus-st':'Focus ST','zzr600':'ZZR600','rz350':'RZ350','tz250':'TZ250','toyota-pickup':'Pickup 22RE'};
const slug = (new URLSearchParams(location.search).get('v') || 'focus-st');

// The modular views. Each panel is tagged with one; Overview shows them all.
const VIEWS = [['overview','Overview'],['knowledge','Knowledge'],['diagnose','Diagnose'],
               ['maintain','Maintain'],['parts','Parts'],['systems','Systems'],['navigator','Navigator']];
const DOMAIN_COLOR = {airflow:'#4f9dff', coolant:'#00bcd4', lubrication:'#e8a33d',
                      function:'#a06cd5', electrical:'#e8000d', mechanical:'#8a8a92'};
let activeView = 'overview';
let codesCache = null;

function fleetBar() {
  document.getElementById('fleet').innerHTML = FLEET.map(s =>
    `<a class="chip" href="?v=${s}" style="text-decoration:none;${s===slug?'border-color:var(--red,#e8000d);color:var(--ink,#eee)':''}">${esc(NAMES[s]||s)}</a>`
  ).join('');
}

async function load() {
  fleetBar();
  let d;
  try {
    const r = await fetch(`../vehicles/${encodeURIComponent(slug)}/intel.json`, {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    d = await r.json();
  } catch (e) {
    document.getElementById('title').textContent = (NAMES[slug]||slug) + ' — Intelligence';
    const err = document.getElementById('err');
    err.hidden = false;
    err.textContent = 'intel.json not available for this machine yet — generate it with `python -m app.cli intel --all` in digital-garage.';
    return;
  }
  render(d);
  wireSearch(d);
}

function tabBar() {
  const tb = document.getElementById('tabs');
  tb.innerHTML = '';
  VIEWS.forEach(([id, label]) => {
    const t = el('div','tab', esc(label));
    t.setAttribute('role','tab');
    t.setAttribute('aria-selected', id === activeView ? 'true' : 'false');
    t.onclick = () => showView(id);
    tb.appendChild(t);
  });
}

function showView(id) {
  activeView = id;
  document.getElementById('q').value = '';
  document.getElementById('results').hidden = true;
  document.getElementById('kpis').hidden = false;
  document.getElementById('panels').hidden = false;
  tabBar();
  document.querySelectorAll('#panels .panel').forEach(p => {
    p.hidden = !(id === 'overview' || p.dataset.view === id);
  });
}

function render(d) {
  document.getElementById('title').textContent = (d.vehicle && d.vehicle.name) || d.variant || 'Vehicle Intelligence';
  document.getElementById('stamp').textContent = 'projected ' + (d.generated_at || '').replace('T',' ').slice(0,16) + ' UTC';

  const k = d.knowledge || {}, tw = d.twin || {}, dg = d.diagnostics || {}, ws = d.workshop || {}, mt = d.maintenance || {};
  const kpis = [
    ['claims', k.total_claims ?? '—'], ['conflicts', k.conflicts ?? 0], ['twin deviations', tw.count ?? 0],
    ['maintenance due', mt.attention ?? 0], ['drift alerts', (d.trends||{}).drifting ?? 0],
    ['anomalies', (d.anomalies||{}).flagged ?? 0],
    ['forecast ≤90d', (d.rul||{}).coming_up ?? 0],
    ['log flags', (d.integrity||{}).findings ?? 0],
    ['corroboratable', (d.corroboration||{}).promotable ?? 0],
    ['parts mapped', (d.parts||{}).matched ?? 0], ['open cases', (dg.open_cases||[]).length],
    ['open work orders', ws.open ?? 0], ['telemetry channels', (d.telemetry||{}).channels ?? 0],
  ];
  const kc = document.getElementById('kpis');
  kpis.forEach(([label, val]) => kc.appendChild(el('div','kpi', `<b>${esc(val)}</b><span>${esc(label)}</span>`)));

  const P = document.getElementById('panels');
  const add = (view, panel) => { panel.dataset.view = view; P.appendChild(panel); };

  // Knowledge quality
  const kp = el('div','panel'); kp.appendChild(el('h2', null, 'Knowledge Quality'));
  const bv = k.by_verification || {};
  ['VEHICLE_VERIFIED','OEM_VERIFIED','CORROBORATED','UNVERIFIED'].forEach(g => {
    if (!bv[g]) return;
    const row = el('div','row');
    row.appendChild(el('span', null, `<span class="tag">${esc(g)}</span>`));
    row.appendChild(el('span', null, `<span class="mono">${esc(bv[g].n)} · ${esc(bv[g].pct)}%</span>`));
    kp.appendChild(row);
    const bar = el('div','bar'); const fill = el('i'); fill.style.width = bv[g].pct+'%'; fill.style.background = gradeColor(g);
    bar.appendChild(fill); kp.appendChild(bar);
  });
  kp.appendChild(el('div','row', `<span class="tag">open gaps</span><span class="mono ${k.gaps? 'warn':'ok'}">${esc(k.gaps ?? 0)}</span>`));
  add('knowledge', kp);

  // Corroboration suggestions — UNVERIFIED claims a sibling could promote (CORR)
  const co = d.corroboration || null;
  const cp = el('div','panel'); cp.appendChild(el('h2', null, 'Corroboration Suggestions'));
  if (!co || !co.unverified) cp.appendChild(el('p','tag','No unverified claims — knowledge is fully graded.'));
  else {
    cp.appendChild(el('div','row', `<span class="tag">one source would promote</span>`
      + `<span class="mono ok">${esc(co.promotable)}/${esc(co.unverified)} unverified</span>`));
    co.candidates.slice(0,8).forEach(c => {
      cp.appendChild(el('div','row', `<span>${esc(c.subject_key)} · ${esc(c.prop)}</span>`
        + `<span class="chip ${c.promotable?'ok':''}">${c.promotable? esc(c.current_verification)+' → '+esc(c.projected_with_trade_source) : esc(c.current_verification)}</span>`));
      cp.appendChild(el('div','tag', esc(c.suggestion)));
    });
    cp.appendChild(el('div','tag','Suggestions only — a found source is proposed, then a human approves.'));
  }
  add('knowledge', cp);

  // Diagnostics
  const dp = el('div','panel'); dp.appendChild(el('h2', null, 'Diagnostics'));
  const cases = dg.open_cases || [];
  if (!cases.length) dp.appendChild(el('p','tag','No open diagnostic cases.'));
  cases.forEach(c => {
    dp.appendChild(el('div','row', `<span><b>${esc(c.code)}</b> ${esc(c.title)}</span><span class="chip">${esc(c.status)}</span>`));
    if (c.leading) dp.appendChild(el('div','tag', `leading: ${esc(c.leading)}`));
    if (c.recommended_test) dp.appendChild(el('div','tag', `▸ next test: ${esc(c.recommended_test)}`));
  });
  add('diagnose', dp);

  // Digital twin deviations
  const twp = el('div','panel'); twp.appendChild(el('h2', null, 'Digital Twin — Deviations from Stock'));
  const devs = tw.deviations || [];
  if (!devs.length) twp.appendChild(el('p','tag','No recorded deviations.'));
  devs.forEach(x => {
    const cls = x.condition === 'failed' ? 'crit' : (x.condition === 'modified' ? 'warn' : '');
    twp.appendChild(el('div','row', `<span>${esc(x.slug)}${x.installed_part? ' → '+esc(x.installed_part):''}</span>`
      + `<span class="chip ${cls}">${esc(x.condition)}</span>`));
  });
  add('diagnose', twp);

  // Workshop
  const wp = el('div','panel'); wp.appendChild(el('h2', null, 'Workshop'));
  const wos = ws.work_orders || [];
  if (!wos.length) wp.appendChild(el('p','tag','No work orders.'));
  wos.forEach(w => {
    wp.appendChild(el('div','row', `<span><b>${esc(w.code||('#'+w.id))}</b> ${esc(w.title)}</span>`
      + `<span class="mono">READY ${esc(w.ready_pct)}%</span>`));
    wp.appendChild(el('div','tag', `${esc(w.status)} · ${esc(w.repair_state)}`));
  });
  add('diagnose', wp);

  // Maintenance
  const mp = el('div','panel');
  const miles = mt.current_miles != null ? ` — @ ${Number(mt.current_miles).toLocaleString()} mi` : '';
  mp.appendChild(el('h2', null, 'Maintenance' + esc(miles)));
  const mstate = {overdue:'crit', due:'warn', due_soon:'warn', needs_log:'', unknown:'', ok:'ok'};
  const mlabel = {overdue:'OVERDUE', due:'DUE', due_soon:'DUE SOON', needs_log:'NO LOG', unknown:'UNKNOWN', ok:'OK'};
  const mc = mt.counts || {};
  const chipRow = el('div','row');
  chipRow.appendChild(el('span','tag', 'status'));
  chipRow.appendChild(el('span', null, ['overdue','due','due_soon','needs_log','ok'].filter(s=>mc[s])
    .map(s=>`<span class="chip ${mstate[s]}">${mc[s]} ${esc(mlabel[s])}</span>`).join(' ') || '<span class="tag">no intervals tracked</span>'));
  mp.appendChild(chipRow);
  (mt.items||[]).slice(0,8).forEach(it => {
    mp.appendChild(el('div','row', `<span>${esc(it.item)}</span><span class="chip ${mstate[it.status]||''}">${esc(mlabel[it.status]||it.status)}</span>`));
    if (it.detail) mp.appendChild(el('div','tag', esc(it.detail)));
  });
  if (!(mt.items||[]).length) mp.appendChild(el('p','tag','No maintenance intervals on record for this machine.'));
  add('maintain', mp);

  // Degradation trends
  const tp = el('div','panel'); tp.appendChild(el('h2', null, 'Degradation Trends'));
  const series = (d.trends||{}).series || [];
  const arrow = {rising:'↗', falling:'↘', flat:'→'};
  if (!series.length) tp.appendChild(el('p','tag','No component has enough observation history to fit a trend yet.'));
  series.slice(0,6).forEach(t => {
    const cls = t.drift ? (t.direction==='falling'?'crit':'warn') : '';
    tp.appendChild(el('div','row', `<span>${esc(t.subject)} · ${esc(t.metric)}</span>`
      + `<span class="chip ${cls}">${esc(arrow[t.direction]||'')} ${esc((t.pct_change*100).toFixed(0))}%${t.drift?' ‼':''}</span>`));
    tp.appendChild(el('div','tag', esc(t.summary)));
  });
  add('maintain', tp);

  // Predictive maintenance — usage-rate due-by projection (RUL)
  const rl = d.rul || null;
  const fp = el('div','panel'); fp.appendChild(el('h2', null, 'Maintenance Forecast'));
  if (!rl) fp.appendChild(el('p','tag','No forecast — this machine has no maintenance intervals yet.'));
  else {
    const u = rl.usage || {};
    fp.appendChild(el('div','row', `<span class="tag">usage rate</span>`
      + `<span class="mono">${u.known ? esc(u.miles_per_year)+' mi/yr' : 'unknown'}</span>`));
    const proj = rl.projected || [];
    if (!proj.length) fp.appendChild(el('p','tag','Nothing to project yet — log a service so an interval has a starting point.'));
    proj.slice(0,8).forEach(p => {
      const cls = p.days_remaining < 0 ? 'crit' : (p.days_remaining <= (rl.horizon_days||90) ? 'warn' : '');
      const when = p.days_remaining < 0 ? 'overdue' : '~'+p.days_remaining+'d';
      fp.appendChild(el('div','row', `<span>${esc(p.item)}</span>`
        + `<span class="chip ${cls}">${esc(p.projected_date)} · ${esc(when)}</span>`));
      fp.appendChild(el('div','tag', `projected by ${esc(p.basis)}`));
    });
    fp.appendChild(el('div','tag','Projections from the usage rate — estimates, not fact.'));
  }
  add('maintain', fp);

  // Anomalies — robust point-outliers in the observation history (ANOM)
  const ap = el('div','panel'); ap.appendChild(el('h2', null, 'Anomalies'));
  const anoms = (d.anomalies||{}).series || [];
  if (!anoms.length) ap.appendChild(el('p','tag','No anomalies in the observation history — every series sits within its robust baseline.'));
  anoms.slice(0,8).forEach(a => {
    ap.appendChild(el('div','row', `<span>${esc(a.subject)} · ${esc(a.metric)}</span>`
      + `<span class="chip ${a.confounded?'warn':'crit'}">⚑ ${esc(a.count)}${a.confounded?' ⚠':''}</span>`));
    ap.appendChild(el('div','tag', esc(a.summary)));
  });
  add('diagnose', ap);

  // Datalog integrity — signal-plausibility checks over recent sessions (INTEG)
  const ig = d.integrity || null;
  const gp = el('div','panel'); gp.appendChild(el('h2', null, 'Datalog Integrity'));
  if (!ig || !ig.sessions_checked) gp.appendChild(el('p','tag','No datalogs to check yet.'));
  else if (!ig.reports.length) gp.appendChild(el('p','tag',`All ${esc(ig.sessions_checked)} recent datalog(s) look plausible.`));
  else {
    const sevcls = {error:'crit', warn:'warn', info:''};
    ig.reports.slice(0,6).forEach(rep => {
      gp.appendChild(el('div','row', `<span>session ${esc(rep.label)}</span>`
        + `<span class="chip warn">${esc(rep.findings.length)} finding${rep.findings.length>1?'s':''}</span>`));
      rep.findings.slice(0,4).forEach(f => gp.appendChild(
        el('div','tag', `<span class="${sevcls[f.severity]||''}">[${esc(f.kind)}]</span> ${esc(f.detail)}`)));
    });
    gp.appendChild(el('div','tag','Plausibility of the log, not a claim about the car.'));
  }
  add('diagnose', gp);

  // Parts fitment
  const pp = el('div','panel'); pp.appendChild(el('h2', null, 'Parts Fitment'));
  const pf = d.parts;
  if (!pf || !pf.slots) pp.appendChild(el('p','tag','No parts catalog resolved for this machine.'));
  else {
    pp.appendChild(el('div','row', `<span class="tag">catalog slots → components</span>`
      + `<span class="mono">${esc(pf.matched)}/${esc(pf.slots)} · ${esc(pf.coverage_pct)}%</span>`));
    const bar = el('div','bar'); const fill = el('i'); fill.style.width = pf.coverage_pct+'%';
    fill.style.background = 'var(--green,#29c07a)'; bar.appendChild(fill); pp.appendChild(bar);
    pp.appendChild(el('div','row', `<span class="tag">confident matches</span><span class="mono ok">${esc(pf.confident)}</span>`));
    pp.appendChild(el('div','row', `<span class="tag">unmapped slots</span><span class="mono ${pf.unmatched? 'warn':'ok'}">${esc(pf.unmatched)}</span>`));
    (pf.unmatched_slots||[]).slice(0,8).forEach(s => pp.appendChild(el('div','tag', '· '+esc(s))));
  }
  add('parts', pp);

  // Engine-bay navigator — interactive graph over the overlays
  add('navigator', buildNavigator(d));

  // Systems + overlays
  const sp = el('div','panel'); sp.appendChild(el('h2', null, 'Systems & Graph Overlays'));
  (d.systems||[]).forEach(s => sp.appendChild(el('div','row', `<span>${esc(s.name)}</span><span class="mono">${esc(s.components)} components</span>`)));
  sp.appendChild(el('div','row', `<span class="tag">overlays</span><span>${(d.overlays||[]).map(o=>`<span class="chip">${esc(o)}</span>`).join(' ')}</span>`));
  add('systems', sp);

  // Research queue
  const rp = el('div','panel'); rp.appendChild(el('h2', null, 'Research Queue'));
  const rts = d.research_tasks || [];
  if (!rts.length) rp.appendChild(el('p','tag','No open research tasks.'));
  rts.forEach(t => {
    const cls = t.priority==='high'||t.priority==='critical' ? 'crit' : (t.priority==='medium'?'warn':'');
    rp.appendChild(el('div','row', `<span>${esc(t.subject)}</span><span class="chip ${cls}">${esc(t.priority)}</span>`));
    if (t.detail) rp.appendChild(el('div','tag', esc(t.detail)));
  });
  add('knowledge', rp);

  tabBar();
  showView('overview');
}

// ---- engine-bay navigator: interactive graph over the overlays ------------
const NAV = { select: null };

function buildNavigator(d) {
  const g = d.graph || {domains:[], nodes:[], edges:[]};
  const panel = el('div','panel nav-panel');
  panel.appendChild(el('h2', null, 'Engine-Bay Navigator'));
  panel.appendChild(el('p','tag','Component map across the graph overlays — pick an overlay to isolate its flow, tap a component for its claims.'));

  const nodes = (g.nodes || []).slice().sort((a,b) =>
    String(a.system||'').localeCompare(String(b.system||'')) || String(a.name).localeCompare(String(b.name)));
  const edges = g.edges || [];
  if (!nodes.length) {
    panel.appendChild(el('p','tag','No graph overlays recorded for this machine yet.'));
    return panel;
  }

  // domain legend — radio-style: "All" or one overlay at a time
  const domains = g.domains && g.domains.length ? g.domains
    : Array.from(new Set(edges.map(e => e.domain))).sort();
  let activeDomain = 'all';
  const legend = el('div','nav-legend');
  const chips = [];
  [['all','all']].concat(domains.map(x => [x, x])).forEach(([id, label]) => {
    const c = el('span','chip');
    const col = id === 'all' ? 'var(--muted,#8a8a92)' : (DOMAIN_COLOR[id] || '#8a8a92');
    c.innerHTML = `<i style="background:${col}"></i>${esc(label)}`;
    c.setAttribute('role','button'); c.setAttribute('aria-pressed', id === 'all' ? 'true' : 'false');
    c.onclick = () => { activeDomain = id; applyDomain(); };
    legend.appendChild(c); chips.push([id, c]);
  });
  panel.appendChild(legend);

  // circular layout, grouped by system order
  const N = nodes.length, cx = 280, cy = 280, R = 205;
  const pos = {};
  nodes.forEach((n, i) => {
    const a = (i / N) * 2 * Math.PI - Math.PI / 2;
    pos[n.slug] = {x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a};
  });

  const parts = [`<svg viewBox="0 0 560 560" role="img" aria-label="Component graph">`];
  edges.forEach((e, i) => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    const col = DOMAIN_COLOR[e.domain] || '#8a8a92';
    parts.push(`<line class="nav-edge" data-domain="${esc(e.domain)}" data-from="${esc(e.from)}" data-to="${esc(e.to)}" `
      + `x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" `
      + `stroke="${col}" stroke-width="1.6" opacity="0.85"><title>${esc(e.from)} → ${esc(e.to)} (${esc(e.domain)} · ${esc(e.medium||e.relation||'')})</title></line>`);
  });
  nodes.forEach(n => {
    const p = pos[n.slug];
    const right = Math.cos(p.a) >= 0;
    const lx = p.x + (right ? 13 : -13);
    parts.push(`<g class="nav-node" data-node="${esc(n.slug)}" tabindex="0">`
      + `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="8" fill="var(--panel,#161619)" stroke="var(--line,#2a2a30)" stroke-width="1.5"></circle>`
      + `<text x="${lx.toFixed(1)}" y="${(p.y+3).toFixed(1)}" text-anchor="${right?'start':'end'}">${esc(n.name)}</text>`
      + `<title>${esc(n.name)} · ${esc(n.system||'')}</title></g>`);
  });
  parts.push('</svg>');

  const grid = el('div','nav-grid');
  const map = el('div','nav-map', parts.join(''));
  const side = el('div','nav-side');
  const detail = el('div','panel nav-detail');
  detail.appendChild(el('h2', null, 'Component'));
  const hint = el('p','tag','Select a component on the map to see its claims and connections.');
  detail.appendChild(hint);
  side.appendChild(detail);
  grid.appendChild(map); grid.appendChild(side);
  panel.appendChild(grid);

  const svg = map.querySelector('svg');
  function applyDomain() {
    chips.forEach(([id, c]) => c.setAttribute('aria-pressed', id === activeDomain ? 'true' : 'false'));
    svg.querySelectorAll('.nav-edge').forEach(ln =>
      ln.classList.toggle('off', activeDomain !== 'all' && ln.dataset.domain !== activeDomain));
  }

  const claimsFor = slug => (d.search_index && d.search_index.claims || [])
    .filter(c => c.subject_key === slug);

  function select(slug) {
    svg.querySelectorAll('.nav-node').forEach(g2 => g2.classList.toggle('sel', g2.dataset.node === slug));
    svg.querySelectorAll('.nav-edge').forEach(ln =>
      ln.setAttribute('stroke-width', (ln.dataset.from === slug || ln.dataset.to === slug) ? '2.6' : '1.6'));
    const node = nodes.find(n => n.slug === slug);
    if (!node) return;
    detail.innerHTML = '';
    detail.appendChild(el('h2', null, esc(node.name)));
    detail.appendChild(el('div','tag', esc(node.system || '—') + ' · ' + esc(slug)));
    const cons = edges.filter(e => e.from === slug || e.to === slug);
    if (cons.length) {
      const ch = el('div', null); ch.style.margin = '8px 0';
      cons.forEach(e => {
        const other = e.from === slug ? e.to : e.from, dir = e.from === slug ? '→' : '←';
        const col = DOMAIN_COLOR[e.domain] || '#8a8a92';
        ch.appendChild(el('div','row', `<span>${dir} ${esc(other)}</span>`
          + `<span class="chip" style="border-color:${col};color:${col}">${esc(e.domain)}</span>`));
      });
      detail.appendChild(ch);
    }
    const cl = claimsFor(slug);
    detail.appendChild(el('div','tag', cl.length ? `${cl.length} claim${cl.length>1?'s':''}` : 'No graded claims on this component yet.'));
    cl.forEach(c => detail.appendChild(el('div','row',
      `<span>${esc(c.prop)}</span><span class="mono" style="color:${gradeColor(c.verification)}">`
      + `${esc(c.value!=null?c.value:'')}${c.unit?' '+esc(c.unit):''}</span>`)));
  }

  svg.querySelectorAll('.nav-node').forEach(gn => {
    const act = () => select(gn.dataset.node);
    gn.addEventListener('click', act);
    gn.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); act(); } });
  });
  applyDomain();
  NAV.select = slug => { showView('navigator'); select(slug); };
  return panel;
}

// ---- universal search over claims + components + DTC codes ----------------
async function loadCodes() {
  if (codesCache) return codesCache;
  try {
    const r = await fetch('../../data/dtc-codes.json', {cache:'force-cache'});
    codesCache = (await r.json()).codes || [];
  } catch (e) { codesCache = []; }
  return codesCache;
}

function wireSearch(d) {
  const idx = d.search_index || {components:[], claims:[]};
  const input = document.getElementById('q');
  const box = document.getElementById('results');
  let codes = [];
  loadCodes().then(c => { codes = c; if (input.value.trim()) run(input.value); });

  function run(qraw) {
    const q = qraw.trim().toLowerCase();
    if (!q) { showView(activeView); return; }
    document.getElementById('kpis').hidden = true;
    document.getElementById('panels').hidden = true;
    box.hidden = false; box.innerHTML = '';
    const out = [];
    (idx.claims||[]).forEach(c => {
      const hay = `${c.subject_key} ${c.prop} ${c.value||''} ${c.subject_type}`.toLowerCase();
      if (hay.includes(q)) out.push({b:'claim', t:`${c.subject_key} · ${c.prop}`,
        s:`${c.value!=null?c.value:''}${c.unit?' '+c.unit:''} · ${c.verification||''}`, act:()=>showView('knowledge')});
    });
    (idx.components||[]).forEach(c => {
      const hay = `${c.slug} ${c.name} ${c.system}`.toLowerCase();
      if (hay.includes(q)) out.push({b:'part', t:esc(c.name), s:`${c.system||''} · ${c.slug}`,
        act:()=> (NAV.select ? NAV.select(c.slug) : showView('systems'))});
    });
    (codes||[]).forEach(c => {
      const hay = `${c.code} ${c.title} ${c.system} ${(c.tags||[]).join(' ')}`.toLowerCase();
      if (hay.includes(q)) out.push({b:'code', t:`${c.code} — ${c.title}`, s:c.system||'',
        href:`dtc.html?code=${encodeURIComponent(c.code)}`});
    });
    if (!out.length) { box.appendChild(el('p','tag','No claims, components, or codes match “'+esc(qraw)+'”.')); return; }
    out.slice(0, 40).forEach(r => {
      const node = el(r.href ? 'a' : 'div', 'result',
        `<span class="b">${esc(r.b)}</span><span class="t">${r.t}<div class="s">${esc(r.s)}</div></span>`);
      if (r.href) node.href = r.href; else node.onclick = r.act;
      box.appendChild(node);
    });
  }
  input.addEventListener('input', () => run(input.value));
}
load();
</script>
