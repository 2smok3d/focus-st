<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>The Garage · Manual</title>
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="../assets/hud.css">
<style>
  .layout{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
  @media(max-width:820px){.layout{grid-template-columns:1fr}.toc{display:none}}
  .toc{position:sticky;top:74px;max-height:calc(100dvh - 96px);overflow-y:auto;border-right:1px solid var(--line);padding-right:16px}
  .toc a{display:block;font-size:12.5px;color:var(--ink3);text-decoration:none;padding:6px 0;line-height:1.4;border-left:2px solid transparent;padding-left:11px;margin-left:-2px;transition:.12s}
  .toc a:hover,.toc a.on{color:var(--ink);border-color:var(--red)}
  .toc .grp{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4);margin:14px 0 4px;padding-left:9px}
  .search-wrap{position:sticky;top:57px;z-index:20;background:var(--bg);padding:12px 0 12px}
  .doc{min-width:0}
  .doc h1{font-family:var(--disp);font-size:clamp(26px,5vw,38px);font-weight:700;letter-spacing:-.01em;margin:6px 0 4px}
  .man-sec{padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .man-sec.hide{display:none}
  .doc h2{font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:.01em;margin:22px 0 12px;
    padding-top:6px;display:flex;align-items:center;gap:10px}
  .doc h2::before{content:"";width:8px;height:8px;background:var(--red);border-radius:2px;flex-shrink:0}
  .doc h3{font-family:var(--disp);font-size:15.5px;font-weight:600;color:var(--ink);margin:18px 0 8px;letter-spacing:.01em}
  .doc h4{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px}
  .doc p{color:var(--ink2);font-size:14px;line-height:1.7;margin:9px 0}
  .doc strong{color:var(--ink);font-weight:600}
  .doc code{font-family:var(--mono);font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink)}
  .doc ul,.doc ol{margin:9px 0 9px 4px;padding-left:20px}
  .doc li{color:var(--ink2);font-size:14px;line-height:1.65;margin:5px 0}
  .doc a.lnk{color:var(--red2);text-decoration:none;border-bottom:1px solid transparent}
  .doc a.lnk:hover{border-color:var(--red)}
  .doc blockquote{border-left:2px solid var(--line2);background:var(--bg2);border-radius:0 8px 8px 0;
    padding:10px 14px;margin:12px 0;color:var(--ink2);font-size:13.5px;line-height:1.6}
  .doc hr{border:none;border-top:1px solid var(--line);margin:16px 0}
  .doc .tbl-wrap{margin:12px 0}
  .count{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:8px}
  .vpill{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);
    border:1px solid var(--line2);border-radius:20px;padding:3px 10px}
</style>
</head>
<body>

<div class="gbar">
  <a class="home" href="../index.html"><span class="dot"></span><span class="wm">THE <em>GARAGE</em></span></a>
  <span class="crumb"><a href="../index.html" style="color:inherit;text-decoration:none">Garage</a><span class="sep">/</span><span id="crumb-v">Manual</span></span>
  <span class="spacer"></span>
  <nav class="gnav">
    <a href="../index.html">◆ <span>Garage</span></a>
    <a href="dtc.html">❏ <span>Codes</span></a>
    <a id="nav-cockpit" href="../index.html">▣ <span>Cockpit</span></a>
  </nav>
</div>

<div class="wrap">
  <div class="search-wrap">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input class="inp" id="q" placeholder="Search the manual — torque, valve, jetting, oil…" enterkeyhint="search" autocorrect="off" style="flex:1;min-width:220px">
      <span class="vpill" id="vlabel">—</span>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="layout">
    <nav class="toc" id="toc"></nav>
    <div class="doc" id="doc"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const P=new URLSearchParams(location.search);
const slug=P.get('v')||'focus-st';
$('#nav-cockpit').href='../vehicles/'+slug+'/index.html';

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inline=s=>esc(s)
  .replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a class="lnk" href="$2" target="_blank" rel="noopener">$1</a>');

function md2html(md){
  const lines=md.split('\n');let out=[],i=0;
  while(i<lines.length){
    let ln=lines[i];
    // table
    if(/^\s*\|.*\|\s*$/.test(ln)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const rows=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){rows.push(lines[i]);i++;}
      const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
      const head=cells(rows[0]);
      let t='<div class="tbl-wrap"><table class="hud"><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>';
      for(let r=2;r<rows.length;r++)t+='<tr>'+cells(rows[r]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';
      out.push(t+'</tbody></table></div>');continue;
    }
    let h=ln.match(/^(#{1,4})\s+(.*)$/);
    if(h){out.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>');i++;continue;}
    if(/^\s*---\s*$/.test(ln)){out.push('<hr>');i++;continue;}
    if(/^\s*>\s?/.test(ln)){let buf=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,''));i++;}out.push('<blockquote>'+inline(buf.join(' '))+'</blockquote>');continue;}
    if(/^\s*[-*]\s+/.test(ln)){let buf=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){buf.push('<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>');i++;}out.push('<ul>'+buf.join('')+'</ul>');continue;}
    if(/^\s*\d+\.\s+/.test(ln)){let buf=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){buf.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>');i++;}out.push('<ol>'+buf.join('')+'</ol>');continue;}
    if(ln.trim()===''){i++;continue;}
    let para=[ln];i++;while(i<lines.length&&lines[i].trim()!==''&&!/^(#{1,4}\s|\s*[-*]\s|\s*\d+\.\s|\s*>|\s*\||---)/.test(lines[i])){para.push(lines[i]);i++;}
    out.push('<p>'+inline(para.join(' '))+'</p>');
  }
  return out.join('\n');
}

let SECTIONS=[];
function build(md){
  // title = first # line
  const titleM=md.match(/^#\s+(.+)$/m);
  const title=titleM?titleM[1]:slug;
  document.title='The Garage · '+title;
  $('#crumb-v').textContent=title;
  $('#vlabel').textContent=slug;
  // split by H2
  const parts=md.split(/\n(?=##\s)/);
  const doc=$('#doc'),toc=$('#toc');
  let html='',tocHtml='';
  parts.forEach((p,idx)=>{
    const hm=p.match(/^##\s+(.+)$/m);
    const id='s'+idx;
    if(idx===0){ html+='<div class="man-sec" id="'+id+'">'+md2html(p)+'</div>'; }
    else{
      const name=hm?hm[1]:('Section '+idx);
      html+='<div class="man-sec" id="'+id+'">'+md2html(p)+'</div>';
      tocHtml+='<a href="#'+id+'" data-id="'+id+'">'+esc(name)+'</a>';
    }
  });
  doc.innerHTML=html;toc.innerHTML=tocHtml;
  SECTIONS=[...doc.querySelectorAll('.man-sec')].map(el=>({el,text:el.textContent.toLowerCase()}));
  toc.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.getElementById(a.dataset.id).scrollIntoView({behavior:'smooth',block:'start'});}));
  $('#count').textContent=SECTIONS.length+' sections';
}

function clearMarks(){document.querySelectorAll('#doc mark').forEach(m=>{const t=document.createTextNode(m.textContent);m.replaceWith(t);});document.querySelectorAll('#doc').forEach(d=>d.normalize());}
function markIn(el,q){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const hits=[];let n;
  while(n=w.nextNode()){if(n.nodeValue.toLowerCase().includes(q)&&!/^(SCRIPT|STYLE|MARK|CODE)$/.test(n.parentNode.nodeName))hits.push(n);}
  hits.slice(0,300).forEach(node=>{const parts=node.nodeValue.split(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'));const frag=document.createDocumentFragment();
    parts.forEach(p=>{if(p.toLowerCase()===q){const mk=document.createElement('mark');mk.textContent=p;frag.appendChild(mk);}else frag.appendChild(document.createTextNode(p));});node.replaceWith(frag);});
}
function search(q){
  q=q.trim().toLowerCase();clearMarks();let shown=0;
  SECTIONS.forEach(s=>{const hit=!q||s.text.includes(q);s.el.classList.toggle('hide',!hit);if(hit&&q){shown++;markIn(s.el,q);}});
  $('#count').textContent=q?(shown+' section'+(shown!==1?'s':'')+' match'):(SECTIONS.length+' sections');
}
$('#q').addEventListener('input',e=>search(e.target.value));

fetch('../../data/vehicles/'+slug+'/manual.md',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('no manual');return r.text();})
  .then(build)
  .catch(()=>{$('#doc').innerHTML='<div class="empty"><div class="glyph">▦</div>No manual for “'+esc(slug)+'” yet.<br>Its cockpit has the working spec + procedures.</div>';$('#count').textContent='';});
</script>
</body>
</html>
