<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">
<title>FOST · Parts</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
<style>
:root{
  --bg:#0a0a0b; --bg2:#0e0e10; --panel:#141416; --panel2:#17171a;
  --line:#232329; --line2:#2e2e35; --ink:#f4f4f6; --ink2:#a2a2ad; --ink3:#63636e;
  --ink4:#3a3a42; --red:#e8000d; --red2:#ff2b38; --green:#35c46a; --amber:#ffb020;
  --disp:'Chakra Petch','Rajdhani',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
/* subtle grid texture */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:radial-gradient(circle at 50% -10%,rgba(232,0,13,.06),transparent 55%);}
.mono{font-family:var(--mono)}
.disp{font-family:var(--disp)}

/* ── Header */
header{flex-shrink:0;position:relative;z-index:2;display:flex;align-items:center;gap:11px;
  padding:max(env(safe-area-inset-top,12px),12px) 18px 11px;border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.06em;display:flex;align-items:center;gap:2px}
.wordmark em{color:var(--red);font-style:normal}
.wordmark .slash{color:var(--ink4);margin:0 5px;font-weight:400}
.wordmark .sub{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);flex-shrink:0}
body.offline .status-dot{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.offline-pill{display:none;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.12em;
  color:var(--amber);border:1px solid rgba(255,176,32,.3);border-radius:20px;padding:2px 8px;text-transform:uppercase}
body.offline .offline-pill{display:block}
.icon-btn{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink3);cursor:pointer;
  padding:8px;border-radius:9px;line-height:0;flex-shrink:0;transition:.12s;-webkit-appearance:none}
.icon-btn:active{background:var(--panel);color:var(--ink)}

.tab-content{flex:1;position:relative;overflow:hidden;z-index:1}
.pane{position:absolute;inset:0;display:flex;flex-direction:column}
.pane.hidden{display:none}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 6px;overscroll-behavior:contain}

/* ── Section label */
.seclabel{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.seclabel .n{font-family:var(--mono);font-size:11px;color:var(--red);font-weight:600;letter-spacing:.1em}
.seclabel h2{font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.seclabel .ln{flex:1;height:1px;background:var(--line)}

/* ── Add form */
.field{margin-bottom:15px}
label{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
input,textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:11px;
  padding:12px 14px;font-size:16px;font-family:var(--sans);outline:none;-webkit-appearance:none;appearance:none;transition:.15s}
input:focus,textarea:focus{border-color:var(--red);background:var(--panel2);box-shadow:0 0 0 3px rgba(232,0,13,.09)}
::placeholder{color:var(--ink4)}
#name{font-size:18px;font-weight:500}
.strip{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:1px}
.strip::-webkit-scrollbar{display:none}
.sub-strip{transition:opacity .14s}.sub-strip.fading{opacity:0}
.cat-pill,.sub-pill{flex-shrink:0;background:var(--panel);border:1px solid var(--line);color:var(--ink3);border-radius:9px;
  padding:9px 14px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.03em;cursor:pointer;
  white-space:nowrap;-webkit-appearance:none;transition:.12s;min-height:38px}
.cat-pill:active,.sub-pill:active{opacity:.7}
.cat-pill.sel{background:rgba(232,0,13,.12);border-color:var(--red);color:var(--ink);font-weight:600}
.sub-pill.sel{background:rgba(232,0,13,.07);border-color:rgba(232,0,13,.5);color:var(--ink2)}
.notes-toggle{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink3);
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;cursor:pointer;padding:2px 0 12px;-webkit-appearance:none;transition:.12s}
.notes-toggle.open{color:var(--ink2)}
.notes-toggle svg{flex-shrink:0;transition:transform .2s}.notes-toggle.open svg{transform:rotate(45deg)}
.notes-area{overflow:hidden;max-height:0;opacity:0;transition:max-height .22s ease,opacity .18s}
.notes-area.open{max-height:120px;opacity:1}
textarea#notes{resize:none;height:76px;line-height:1.5;font-size:15px}

.recent{margin-top:16px}
.ritem{padding:10px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;overflow:hidden}
.ritem:last-child{border-bottom:none}
.rcat{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  color:var(--red);flex-shrink:0;min-width:56px}
.rname{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.rname a{color:var(--ink2);text-decoration:none}

/* ── Action bar */
.action-bar{flex-shrink:0;position:relative;z-index:2;padding:8px 18px calc(8px + env(safe-area-inset-bottom,0));
  background:linear-gradient(to top,var(--bg) 60%,transparent);border-top:1px solid var(--line)}
.btn{width:100%;padding:14px;background:var(--red);color:#fff;border:none;border-radius:12px;
  font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:.12s;-webkit-appearance:none;min-height:52px}
.btn:active:not(:disabled){transform:scale(.985);filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--panel);color:var(--ink2);border:1px solid var(--line);font-size:13px;margin-top:10px;min-height:48px}
.btn.ghost:active:not(:disabled){background:var(--panel2)}
.spinner{width:15px;height:15px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;
  animation:spin .65s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Tab bar */
.tab-bar{flex-shrink:0;position:relative;z-index:2;display:flex;border-top:1px solid var(--line);background:var(--bg);
  padding-bottom:env(safe-area-inset-bottom,0)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:none;
  color:var(--ink4);cursor:pointer;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;padding:11px 0;transition:.15s;-webkit-appearance:none;min-height:54px;position:relative}
.tab.sel{color:var(--red)}
.tab.sel::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:2px;background:var(--red)}
.tab svg{flex-shrink:0}

/* ── Garage + Mods topbars */
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px;border-bottom:1px solid var(--line)}
.topbar .lbl{font-family:var(--mono);font-size:10px;color:var(--ink3);font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.refresh-btn{background:none;border:1px solid var(--line);color:var(--ink3);cursor:pointer;padding:7px;border-radius:8px;line-height:0;-webkit-appearance:none;transition:.12s}
.refresh-btn:active{color:var(--ink)}
.refresh-btn.spinning svg{animation:spin .8s linear infinite}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ── Garage sections */
.g-section{border-bottom:1px solid var(--line)}
.g-section-hdr{display:flex;align-items:center;padding:15px 18px;cursor:pointer;gap:11px;transition:background .1s}
.g-section-hdr:active{background:var(--bg2)}
.g-section-name{flex:1;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
.g-count{font-family:var(--mono);font-size:10px;color:var(--ink4)}
.g-chevron{transition:transform .2s;color:var(--ink4);flex-shrink:0}
.g-section.open .g-chevron{transform:rotate(90deg)}
.g-slots{display:none}.g-section.open .g-slots{display:block}
.g-slot{display:flex;align-items:center;padding:12px 18px 12px 28px;border-top:1px solid var(--line);cursor:pointer;gap:9px;transition:background .1s}
.g-slot:active{background:var(--bg2)}
.g-slot-name{font-size:13px;color:var(--ink2);font-weight:500;flex-shrink:0;white-space:nowrap;max-width:44%}
.g-slot-installed{flex:1;font-family:var(--mono);font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;padding:0 6px}
.g-slot-cond{font-size:12px;flex-shrink:0}
.g-slot-arr{color:var(--ink4);flex-shrink:0}
.loading{padding:44px 18px;display:flex;justify-content:center}
.big-spinner{border:2.5px solid rgba(255,255,255,.06);border-top-color:var(--red);width:24px;height:24px;border-radius:50%;animation:spin .8s linear infinite}
.empty,.errbox{padding:44px 24px;text-align:center;color:var(--ink3);font-size:14px;line-height:1.6}
.errbox{color:var(--red2)}
.empty .glyph{font-size:30px;margin-bottom:12px;opacity:.6}

/* ── Mods */
.mod-sec-hdr{padding:16px 18px 6px;font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.mod-item{padding:12px 18px;border-bottom:1px solid var(--line)}
.mod-slot-name{font-family:var(--mono);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:6px}
.mod-stock{font-size:11px;color:var(--ink4);margin-bottom:5px}
.mod-row{display:flex;align-items:center;gap:9px}
.mod-installed{font-size:14px;color:var(--ink);font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-badge{font-family:var(--mono);font-size:9px;color:var(--green);border:1px solid rgba(53,196,106,.3);border-radius:20px;padding:2px 7px;flex-shrink:0;letter-spacing:.06em}
.mod-link{color:var(--ink3);text-decoration:none;padding:5px;line-height:0;flex-shrink:0;transition:.12s}
.mod-link:active{color:var(--ink)}

/* ── Sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:150;opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-bg.open{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;
  z-index:151;display:flex;flex-direction:column;max-height:82vh;transform:translateY(100%);
  transition:transform .3s cubic-bezier(.34,1.1,.64,1);padding-bottom:env(safe-area-inset-bottom,0)}
.sheet.open{transform:translateY(0)}
.handle{width:34px;height:4px;background:var(--line2);border-radius:2px;margin:9px auto 0;flex-shrink:0}
.sheet-hdr{flex-shrink:0;display:flex;align-items:flex-start;padding:14px 18px 11px;gap:12px;border-bottom:1px solid var(--line)}
.sheet-title{flex:1;min-width:0}
.sheet-slot-name{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:.04em;color:var(--ink)}
.sheet-cur{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-x{background:none;border:none;color:var(--ink3);cursor:pointer;padding:4px;line-height:0;-webkit-appearance:none;transition:.12s;flex-shrink:0}
.sheet-x:active{color:var(--ink)}
.sheet-rows{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-row{display:flex;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;gap:11px;transition:background .1s}
.sheet-row:active,.sheet-row.sel{background:var(--panel2)}
.sheet-row.sel .srow-name{color:var(--ink)}
.srow-tier{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--red);width:64px;flex-shrink:0}
.srow-info{flex:1;min-width:0}
.srow-name{font-size:14px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.12s}
.srow-sub{font-family:var(--mono);font-size:10.5px;color:var(--ink4);margin-top:3px}
.srow-price{font-family:var(--mono);font-size:12px;color:var(--ink3);flex-shrink:0}
.srow-link{flex-shrink:0;color:var(--ink4);text-decoration:none;padding:6px 3px;line-height:0;transition:.12s}
.srow-link:active{color:var(--ink)}
.sheet-confirm{flex-shrink:0;border-top:1px solid var(--line2);padding:11px 14px;align-items:center;gap:8px;background:var(--bg);display:none}
.confirm-txt{flex:1;font-size:13px;color:var(--ink2);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.confirm-cancel{background:none;border:1px solid var(--line2);color:var(--ink3);border-radius:9px;padding:9px 13px;
  font-family:var(--mono);font-size:12px;cursor:pointer;-webkit-appearance:none;white-space:nowrap;flex-shrink:0}
.confirm-install{background:var(--red);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-family:var(--disp);
  font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;-webkit-appearance:none;
  white-space:nowrap;display:flex;align-items:center;gap:6px;min-height:37px;flex-shrink:0}
.confirm-install:disabled{opacity:.4}

/* Token sheet */
.tok-body{padding:20px 18px 16px;display:flex;flex-direction:column;gap:14px}
.tok-hint{font-family:var(--mono);font-size:11px;color:var(--ink3);line-height:1.7}
.tok-hint a{color:var(--red);text-decoration:none}
.tok-hint b{color:var(--ink2);font-weight:600}

/* Success overlay */
.success{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.success.show{opacity:1;pointer-events:all}
.success-check{width:64px;height:64px;background:rgba(53,196,106,.1);border:1px solid rgba(53,196,106,.3);border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.success-name{font-family:var(--disp);font-size:16px;font-weight:600;text-align:center;padding:0 32px;max-width:320px}
.success-cat{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}

/* Toast */
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,18px));left:14px;right:14px;max-width:440px;margin:0 auto;
  background:var(--panel);border:1px solid var(--line2);padding:12px 15px;border-radius:12px;display:flex;align-items:center;
  gap:11px;font-size:14px;font-weight:500;transform:translateY(120px);opacity:0;
  transition:transform .28s cubic-bezier(.34,1.45,.64,1),opacity .18s;pointer-events:none;z-index:300}
.toast.show{transform:translateY(0);opacity:1;pointer-events:all}
.toast::before{content:"";width:3px;align-self:stretch;border-radius:2px;background:var(--ink3);flex-shrink:0}
.toast.ok::before{background:var(--green)}.toast.err::before{background:var(--red2)}
.toast.ok .tmsg{color:var(--green)}.toast.err .tmsg{color:var(--red2)}
.tmsg{flex:1}
.tdis{background:none;border:none;color:var(--ink4);cursor:pointer;font-size:20px;padding:0;line-height:1;flex-shrink:0}
</style>
</head>
<body>

<header>
  <a href="../index.html" aria-label="Back to Garage" style="display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit">
    <span class="status-dot"></span>
    <div class="wordmark">FO<em>S</em>T<span class="slash">//</span><span class="sub">Parts</span></div>
  </a>
  <span class="offline-pill">Offline</span>
  <button class="icon-btn" id="btn-cfg" aria-label="Settings">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</header>

<div class="tab-content">
  <!-- ADD -->
  <div class="pane" id="pane-add">
    <div class="scroll-area">
      <div class="seclabel"><span class="n">01</span><h2>Add to Wishlist</h2><span class="ln"></span></div>
      <div class="field">
        <label>Part name *</label>
        <input type="text" id="name" placeholder="e.g. Mountune MP215 upgrade" autocorrect="off" autocapitalize="words" enterkeyhint="go">
      </div>
      <div class="field"><label>Category</label><div class="strip" id="cat-strip" role="group"></div></div>
      <div class="field"><label>Subcategory</label><div class="strip sub-strip" id="sub-strip" role="group"></div></div>
      <div class="field">
        <label>Product URL</label>
        <input type="url" id="url" placeholder="https://…" inputmode="url" autocomplete="off" autocorrect="off" enterkeyhint="next">
      </div>
      <button type="button" class="notes-toggle" id="notes-toggle">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        Add notes
      </button>
      <div class="notes-area" id="notes-area"><textarea id="notes" placeholder="Price, fitment, priority…" enterkeyhint="go"></textarea></div>
      <div id="recent" class="recent" style="display:none">
        <div class="seclabel"><span class="n">▾</span><h2>Recent</h2><span class="ln"></span></div>
        <div id="recent-list"></div>
      </div>
    </div>
  </div>

  <!-- GARAGE -->
  <div class="pane hidden" id="pane-garage">
    <div class="topbar"><span class="lbl" id="g-stats">Catalog</span>
      <button class="refresh-btn" id="g-refresh" aria-label="Refresh">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M23 4v6h-6M1 20v-6h6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="scroll" id="garage-scroll"><div class="loading"><div class="big-spinner"></div></div></div>
  </div>

  <!-- MODS -->
  <div class="pane hidden" id="pane-mods">
    <div class="topbar"><span class="lbl" id="mods-stats">Changes from stock</span></div>
    <div class="scroll" id="mods-scroll"><div class="loading"><div class="big-spinner"></div></div></div>
  </div>
</div>

<div class="action-bar" id="action-bar"><button class="btn" id="btn-add">Add to list</button></div>

<nav class="tab-bar">
  <button class="tab sel" id="tab-add-btn">
    <svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>Add
  </button>
  <button class="tab" id="tab-garage-btn">

  </button>

  <div class="handle"></div>
  <div class="sheet-hdr">
    <div class="sheet-title"><div class="sheet-slot-name">GitHub Token</div><div class="sheet-cur">Connects the app to the repo database</div></div>

<!-- Success overlay -->
<div class="success" id="success-overlay">
  <div class="success-check"><svg width="26" height="26" fill="none" stroke="#35c46a" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="success-name" id="success-name"></div>
  <div class="success-cat" id="success-cat"></div>
</div>

<div class="toast" id="toast"><span class="tmsg" id="tmsg"></span><button class="tdis" aria-label="Dismiss">&#xD7;</button></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   FOST // Parts — single-file PWA. GitHub repo is the database.
   Reads/writes data/PARTS.md + data/MODS.md via the Contents API.
   ═══════════════════════════════════════════════════════════════════ */
const OWNER='2smok3d', REPO='focus-st';
/* Vehicle-aware: ?v=<slug> selects which vehicle's catalog to edit. All vehicles
   live in the one repo, so a single token covers them. Defaults to focus-st. */
const VEHICLES={
  'focus-st':{name:'Focus ST',parts:'data/vehicles/focus-st/PARTS.md',mods:'data/vehicles/focus-st/MODS.md'}
};
const VSLUG=new URLSearchParams(location.search).get('v')||'focus-st';
const VEH=VEHICLES[VSLUG]||VEHICLES['focus-st'];
const PARTS_PATH=VEH.parts, MODS_PATH=VEH.mods;

/* ── Taxonomy (cosmetic pills; Add always appends to ## Wishlist) ── */
const CATS=[
  {val:'Performance',label:'Performance',subs:[
    {val:'Engine / Intake',label:'Engine'},{val:'Exhaust',label:'Exhaust'},{val:'Suspension',label:'Suspension'},
    {val:'Brakes',label:'Brakes'},{val:'Cooling',label:'Cooling'},{val:'Drivetrain',label:'Drivetrain'},{val:'Tune / ECU',label:'Tune'}]},
  {val:'Exterior',label:'Exterior',subs:[
    {val:'Wheels & Tires',label:'Wheels'},{val:'Body / Aero',label:'Body & Aero'},{val:'Lighting',label:'Lighting'},{val:'Wraps & Paint',label:'Wraps'}]},
  {val:'Interior',label:'Interior',subs:[
    {val:'Seats / Harness',label:'Seats'},{val:'Gauges & Displays',label:'Gauges'},{val:'Audio',label:'Audio'},
    {val:'Pedals & Steering',label:'Pedals'},{val:'Other Interior',label:'Other'}]},
  {val:'Maintenance & Consumables',label:'Maintenance',subs:[
    {val:'Fluids & Filters',label:'Fluids'},{val:'Wear Items',label:'Wear Items'},{val:'Tools',label:'Tools'}]}
];

/* ── Storage ── */
const K={tok:'fst_tok',cache:'fst_cache',hist:'fst_hist',cat:'fst_cat',sub:'fst_sub'};
const getToken =()=>{try{return localStorage.getItem(K.tok)||null;}catch{return null;}};
const saveToken=t=>{try{localStorage.setItem(K.tok,t);}catch{}};
const getCfg   =()=>{const t=getToken();return t?{owner:OWNER,repo:REPO,token:t}:null;};
const getCache =()=>{try{const c=JSON.parse(localStorage.getItem(K.cache));return c&&Date.now()-c.ts<3e5?c:null;}catch{return null;}};
const setCache =(sha,c)=>localStorage.setItem(K.cache,JSON.stringify({sha,content:c,ts:Date.now()}));
const clearCache=()=>localStorage.removeItem(K.cache);
const getHist  =()=>{try{return JSON.parse(localStorage.getItem(K.hist))||[];}catch{return[];}};
const pushHist =i=>{const h=getHist();h.unshift(i);localStorage.setItem(K.hist,JSON.stringify(h.slice(0,8)));};
const getSubs  =()=>{try{return JSON.parse(localStorage.getItem(K.sub))||{};}catch{return{};}};
const saveSubs =s=>localStorage.setItem(K.sub,JSON.stringify(s));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ── Toast ── */
let _tt;
const toast=(msg,type='ok')=>{const el=$('toast');$('tmsg').textContent=msg;el.className='toast show '+type;
  clearTimeout(_tt);_tt=setTimeout(()=>el.className='toast',type==='err'?4500:2600);};
document.querySelector('.tdis').onclick=()=>$('toast').className='toast';

/* ── GitHub Contents API ── */
const ghHdrs=tok=>({Authorization:'token '+tok,Accept:'application/vnd.github.v3+json'});
const ghUrl =(c,p)=>`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${p}`;
const decode=b64=>decodeURIComponent(escape(atob(b64.replace(/\n/g,''))));
const encode=s=>btoa(unescape(encodeURIComponent(s)));
const ghGet=async(c,p)=>{
  const r=await fetch(ghUrl(c,p),{headers:ghHdrs(c.token)});
  if(!r.ok){if(r.status===401)throw new Error('Bad token — check settings');
    if(r.status===404)throw new Error('File not found: '+p);throw new Error('GitHub '+r.status);}
  return r.json();
};
const ghPut=async(c,p,content,sha,msg)=>{
  const body={message:msg,content:encode(content)};if(sha)body.sha=sha;
  const r=await fetch(ghUrl(c,p),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHdrs(c.token)),body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json().catch(()=>({}));const err=new Error(e.message||'GitHub '+r.status);if(r.status===409)err.conflict=true;throw err;}
  return r.json();
};

/* ── PARTS.md parsing / mutation (format-critical — matches the catalog spec) ── */
const parseCatalog=md=>{
  const lines=md.split('\n'),sections=[];let sec=null,slot=null,inUpg=false,upgRows=[];
  const finalizeSlot=()=>{if(slot){slot.upgrades=[...upgRows];upgRows=[];}slot=null;inUpg=false;};
  for(const line of lines){
    const sm=line.match(/<summary><b>([^<]+)<\/b><\/summary>/);
    if(sm){finalizeSlot();sec={name:sm[1],slots:[]};sections.push(sec);continue;}
    const pm=line.match(/^#### (.+)/);
    if(pm&&sec){finalizeSlot();slot={name:pm[1],installed:'',installedUrl:'',condition:'⚠️',isMod:false,upgrades:[]};sec.slots.push(slot);continue;}
    if(line.startsWith('**Installed:**')&&slot){
      const raw=line.slice('**Installed:**'.length).trim();slot.isMod=raw.includes('<!-- MOD -->');
      const clean=raw.replace(/<!--.*?-->/g,'').trim();const lm=clean.match(/^\[([^\]]+)\]\(([^)]+)\)/);
      if(lm){slot.installed=lm[1];slot.installedUrl=lm[2];}else{slot.installed=clean.replace(/\s*[·—].*$/,'').trim()||clean;}
      slot.condition=clean.includes('✅')?'✅':clean.includes('🔧')?'🔧':'⚠️';continue;
    }
    if(line.includes('<summary>')&&!line.includes('<b>')&&slot){inUpg=true;upgRows=[];continue;}
    if(line==='</details>'&&inUpg){if(slot)slot.upgrades=[...upgRows];inUpg=false;continue;}
    if(inUpg&&line.startsWith('|')&&!line.startsWith('|---')){
      const cols=line.split('|').slice(1,-1).map(c=>c.trim());
      if(cols.length>=2&&cols[0]&&cols[0]!=='Tier'&&cols[0]!=='Tool'&&cols[0]!=='Item'){
        const lm=cols[1]?.match(/^\[([^\]]+)\]\(([^)]+)\)/);
        upgRows.push({tier:cols[0],name:lm?lm[1]:(cols[1]||''),url:lm?lm[2]:'',partNum:cols[2]||'',price:cols[3]||'',notes:cols[4]||''});
      }
    }
  }
  finalizeSlot();return sections;
};
const updateInstallInMd=(md,slotName,partName,partUrl)=>{
  const lines=md.split('\n'),base=slotName.split(' *(')[0];let inSlot=false;
  for(let i=0;i<lines.length;i++){
    if(lines[i].startsWith('#### ')){const h=lines[i].slice(5).trim();inSlot=(h===slotName||h.startsWith(base));continue;}
    if(inSlot&&lines[i].startsWith('**Installed:**')){lines[i]=`**Installed:** ${partUrl?`[${partName}](${partUrl})`:partName} — ✅ installed <!-- MOD -->`;return lines.join('\n');}
    if(inSlot&&(lines[i].startsWith('#### ')||lines[i].includes('<summary><b>'))){inSlot=false;}
  }
  throw new Error(`Slot "${slotName}" not found in PARTS.md`);
};
const generateModsMd=catalog=>{
  const out=['# Focus ST — Changes from OEM','','*Auto-generated from the FOST parts tracker*','','---',''];let any=false;
  for(const sec of catalog){
    const mods=sec.slots.filter(s=>s.isMod);if(!mods.length)continue;any=true;out.push('## '+sec.name,'');
    for(const s of mods){out.push('**'+s.name.split(' *(')[0]+'**');
      const oem=s.upgrades.find(u=>/^oem$/i.test(u.tier));if(oem)out.push('Stock: '+oem.name+(oem.partNum&&oem.partNum!=='—'?' · '+oem.partNum:''));
      out.push('Installed: '+(s.installedUrl?`[${s.installed}](${s.installedUrl})`:s.installed)+' ✅','');}
    out.push('---','');
  }
  if(!any)out.push('*No modifications from stock yet.*','');return out.join('\n');
};
const injectLine=(md,line)=>{
  const lines=md.split('\n');const wi=lines.findIndex(l=>l.trim()==='## Wishlist');
  if(wi!==-1){let end=lines.length;for(let i=wi+1;i<lines.length;i++){if(/^## /.test(lines[i])){end=i;break;}}
    let at=end;for(let i=end-1;i>wi;i--){if(lines[i].trim()){at=i+1;break;}}lines.splice(at,0,line);return lines.join('\n');}
  lines.push('','---','','## Wishlist','',line,'');return lines.join('\n');
};

/* ── Token sheet ── */
const openTok=()=>{$('tok-input').value=getToken()||'';$('tok-bg').classList.add('open');$('tok-sheet').classList.add('open');setTimeout(()=>$('tok-input').focus(),350);};
const closeTok=()=>{$('tok-bg').classList.remove('open');$('tok-sheet').classList.remove('open');};
$('tok-bg').addEventListener('click',closeTok);$('tok-x').addEventListener('click',closeTok);$('btn-cfg').addEventListener('click',openTok);
$('tok-save').addEventListener('click',()=>{const t=$('tok-input').value.trim();if(!t){toast('Paste your token first','err');return;}
  saveToken(t);clearCache();catalogLoaded=false;toast('Saved');closeTok();});
$('tok-test').addEventListener('click',async()=>{const btn=$('tok-test');const t=$('tok-input').value.trim();
  if(!t){toast('Paste your token first','err');return;}btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Testing…';
  try{const data=await ghGet({owner:OWNER,repo:REPO,token:t},PARTS_PATH);
    const n=decode(data.content).split('\n').filter(l=>l.startsWith('**Installed:**')).length;
    toast('Connected — '+n+' part slot'+(n!==1?'s':'')+' tracked');}
  catch(e){toast(e.message,'err');}finally{btn.disabled=false;btn.textContent='Test connection';}});

/* ── Tabs ── */
let activeTab='add',catalogLoaded=false;
const switchTab=tab=>{activeTab=tab;['add','garage','mods'].forEach(t=>{
    $('pane-'+t).classList.toggle('hidden',t!==tab);$('tab-'+t+'-btn').classList.toggle('sel',t===tab);});
  $('action-bar').style.display=tab==='add'?'':'none';
  if((tab==='garage'||tab==='mods')&&!catalogLoaded){catalogLoaded=true;loadCatalog();}};
$('tab-add-btn').onclick=()=>switchTab('add');$('tab-garage-btn').onclick=()=>switchTab('garage');$('tab-mods-btn').onclick=()=>switchTab('mods');

/* ── Category / subcategory pills ── */
let activeCat=(()=>{try{return localStorage.getItem(K.cat)||'Performance';}catch{return'Performance';}})();
let activeSubs=getSubs();
const catData=v=>CATS.find(c=>c.val===v);
const curSub =()=>activeSubs[activeCat]||catData(activeCat)?.subs[0]?.val||'';
const subLabel=(cat,sub)=>{const c=CATS.find(x=>x.val===cat);return c?.subs.find(s=>s.val===sub)?.label||sub||cat;};
const renderCats=()=>{const strip=$('cat-strip');
  strip.innerHTML=CATS.map(c=>`<button type="button" class="cat-pill${c.val===activeCat?' sel':''}" data-val="${esc(c.val)}">${esc(c.label)}</button>`).join('');
  strip.querySelectorAll('.cat-pill').forEach(p=>p.addEventListener('click',()=>{if(p.dataset.val===activeCat)return;
    activeCat=p.dataset.val;localStorage.setItem(K.cat,activeCat);renderCats();renderSubs(true);}));};
const renderSubs=animate=>{const strip=$('sub-strip'),cat=catData(activeCat);if(!cat)return;const cs=curSub();
  const doRender=()=>{strip.innerHTML=cat.subs.map(s=>`<button type="button" class="sub-pill${s.val===cs?' sel':''}" data-val="${esc(s.val)}">${esc(s.label)}</button>`).join('');
    strip.querySelectorAll('.sub-pill').forEach(p=>p.addEventListener('click',()=>{const subs=getSubs();subs[activeCat]=p.dataset.val;saveSubs(subs);activeSubs=subs;
      strip.querySelectorAll('.sub-pill').forEach(x=>x.classList.toggle('sel',x.dataset.val===p.dataset.val));}));
    strip.classList.remove('fading');strip.scrollLeft=0;};
  if(animate){strip.classList.add('fading');setTimeout(doRender,140);}else doRender();};

/* ── Notes toggle ── */
let notesOpen=false;const notesToggle=$('notes-toggle'),notesArea=$('notes-area');
notesToggle.addEventListener('click',()=>{notesOpen=!notesOpen;notesArea.classList.toggle('open',notesOpen);notesToggle.classList.toggle('open',notesOpen);
  if(notesOpen)setTimeout(()=>$('notes').focus(),220);});

/* ── Recent ── */
const renderHist=()=>{const h=getHist(),wrap=$('recent');if(!h.length){wrap.style.display='none';return;}wrap.style.display='block';
  $('recent-list').innerHTML=h.map(i=>`<div class="ritem"><span class="rcat">${esc(subLabel(i.cat,i.sub))}</span>`+
    `<span class="rname">${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.name)}</a>`:esc(i.name)}</span></div>`).join('');};

/* ── Shared title cleanup (Web Share Target) ── */
const cleanTitle=t=>!t?'':t
  .replace(/^Amazon\.com\s*[:·]\s*/i,'')
  .replace(/\s*[-–—|·]\s*(Amazon\.com|eBay|Walmart|CARiD|RockAuto|AutoZone|O'Reilly|JEGS|Summit Racing|Holley|AmericanMuscle|TireRack|Advance Auto).*/i,'')
  .replace(/ \| [^|]{1,50}$/,'').trim().slice(0,100);

/* ── SVG glyphs ── */
const chevSvg=`<svg class="g-chevron" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const arrSvg=`<svg class="g-slot-arr" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const extSvg=`<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="15 3 21 3 21 9" stroke-linecap="round" stroke-linejoin="round"/><line x1="10" y1="14" x2="21" y2="3" stroke-linecap="round"/></svg>`;

/* ── Catalog load + views ── */
let catalogData=null;
const buildViews=content=>{catalogData=parseCatalog(content);renderGarage(catalogData);renderMods(catalogData);};
const loadCatalog=async(force=false)=>{const c=getCfg();if(!c)return;if(force)clearCache();
  const cached=getCache();if(cached){buildViews(cached.content);return;}
  $('garage-scroll').innerHTML='<div class="loading"><div class="big-spinner"></div></div>';
  $('mods-scroll').innerHTML='<div class="loading"><div class="big-spinner"></div></div>';
  try{const data=await ghGet(c,PARTS_PATH);const content=decode(data.content);setCache(data.sha,content);buildViews(content);}
  catch(e){$('garage-scroll').innerHTML=`<div class="errbox">${esc(e.message)}</div>`;$('mods-scroll').innerHTML=`<div class="empty">${esc(e.message)}</div>`;}};
$('g-refresh').addEventListener('click',async()=>{const btn=$('g-refresh');btn.classList.add('spinning');catalogLoaded=true;await loadCatalog(true);btn.classList.remove('spinning');});

const renderGarage=sections=>{const total=sections.reduce((n,s)=>n+s.slots.length,0);
  $('g-stats').textContent=`${sections.length} sections · ${total} slots`;const scroll=$('garage-scroll');
  scroll.innerHTML=sections.map((sec,si)=>`
    <div class="g-section" id="gsec-${si}">
      <div class="g-section-hdr" data-si="${si}"><span class="g-section-name">${esc(sec.name)}</span><span class="g-count">${sec.slots.length}</span>${chevSvg}</div>
      <div class="g-slots">${sec.slots.map((slot,gi)=>`
        <div class="g-slot" data-si="${si}" data-gi="${gi}">
          <span class="g-slot-name">${esc(slot.name.split(' *(')[0])}</span>
          <span class="g-slot-installed">${esc(slot.installed||'—')}</span>
          <span class="g-slot-cond">${slot.condition}</span>${arrSvg}
        </div>`).join('')}</div>
    </div>`).join('');
  scroll.querySelectorAll('.g-section-hdr').forEach(hdr=>hdr.addEventListener('click',()=>$('gsec-'+hdr.dataset.si).classList.toggle('open')));
  scroll.querySelectorAll('.g-slot').forEach(row=>row.addEventListener('click',()=>{const slot=catalogData[+row.dataset.si]?.slots[+row.dataset.gi];if(slot)openSheet(slot);}));};

const renderMods=sections=>{const groups=sections.map(s=>({name:s.name,items:s.slots.filter(x=>x.isMod)})).filter(s=>s.items.length);const scroll=$('mods-scroll');
  if(!groups.length){$('mods-stats').textContent='All stock';
    scroll.innerHTML='<div class="empty"><div class="glyph">✓</div>No changes from OEM yet.<br>Garage → tap a slot → install an upgrade.</div>';return;}
  const total=groups.reduce((n,s)=>n+s.items.length,0);$('mods-stats').textContent=`${total} change${total!==1?'s':''} from stock`;
  scroll.innerHTML=groups.map(sec=>`<div class="mod-sec-hdr">${esc(sec.name)}</div>
    ${sec.items.map(slot=>{const oem=slot.upgrades.find(u=>/^oem$/i.test(u.tier));
      return `<div class="mod-item"><div class="mod-slot-name">${esc(slot.name.split(' *(')[0])}</div>
        ${oem?`<div class="mod-stock">Stock: ${esc(oem.name)}${oem.partNum&&oem.partNum!=='—'?' · '+esc(oem.partNum):''}</div>`:''}
        <div class="mod-row"><span class="mod-installed">${esc(slot.installed)}</span><span class="mod-badge">MOD</span>
          ${slot.installedUrl?`<a class="mod-link" href="${esc(slot.installedUrl)}" target="_blank" rel="noopener">${extSvg}</a>`:''}</div>
      </div>`;}).join('')}`).join('');};

/* ── Upgrade sheet ── */
let sheetSlot=null,selectedUpg=null;
const openSheet=slot=>{sheetSlot=slot;selectedUpg=null;
  $('sheet-slot-name').textContent=slot.name.split(' *(')[0];$('sheet-cur').textContent='Currently: '+slot.installed+' '+slot.condition;
  $('sheet-confirm').style.display='none';const rows=$('sheet-rows');
  if(!slot.upgrades.length){rows.innerHTML='<div class="empty">No options defined for this slot.</div>';}
  else{rows.innerHTML=slot.upgrades.map((u,i)=>`
      <div class="sheet-row" data-i="${i}"><span class="srow-tier">${esc(u.tier)}</span>
        <div class="srow-info"><div class="srow-name">${esc(u.name)}</div>
          <div class="srow-sub">${[u.partNum&&u.partNum!=='—'?esc(u.partNum):'',u.notes?esc(u.notes):''].filter(Boolean).join(' · ')}</div></div>
        <span class="srow-price">${esc(u.price)}</span>
        ${u.url?`<a class="srow-link" href="${esc(u.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${extSvg}</a>`:''}
      </div>`).join('');
    rows.querySelectorAll('.sheet-row').forEach(row=>row.addEventListener('click',()=>{selectedUpg=slot.upgrades[+row.dataset.i];
      rows.querySelectorAll('.sheet-row').forEach(r=>r.classList.remove('sel'));row.classList.add('sel');
      const n=selectedUpg.name;$('confirm-txt').textContent='Install '+(n.length>30?n.slice(0,30)+'…':n)+'?';$('sheet-confirm').style.display='flex';}));}
  $('sheet-bg').classList.add('open');$('upg-sheet').classList.add('open');};
const closeSheet=()=>{$('sheet-bg').classList.remove('open');$('upg-sheet').classList.remove('open');sheetSlot=null;selectedUpg=null;};
$('sheet-bg').addEventListener('click',closeSheet);$('sheet-x').addEventListener('click',closeSheet);
$('confirm-cancel').addEventListener('click',()=>{selectedUpg=null;$('sheet-confirm').style.display='none';$('sheet-rows').querySelectorAll('.sheet-row').forEach(r=>r.classList.remove('sel'));});

/* ── Install (write PARTS.md → regenerate MODS.md) ── */
const doInstallPart=async(c,slotName,partName,partUrl)=>{
  const run=async(sha,content)=>{const updated=updateInstallInMd(content,slotName,partName,partUrl);const newCat=parseCatalog(updated);
    const res=await ghPut(c,PARTS_PATH,updated,sha,'install: '+partName);setCache(res.content.sha,updated);
    try{const md=await ghGet(c,MODS_PATH).catch(()=>null);await ghPut(c,MODS_PATH,generateModsMd(newCat),md?.sha,'update mods log');}catch(e){console.warn('MODS.md:',e.message);}
    buildViews(updated);};
  const cached=getCache();if(cached){try{await run(cached.sha,cached.content);return;}catch(e){if(!e.conflict)throw e;clearCache();}}
  const raw=await ghGet(c,PARTS_PATH);const content=decode(raw.content);setCache(raw.sha,content);await run(raw.sha,content);};
$('confirm-install').addEventListener('click',async()=>{const c=getCfg();if(!c||!sheetSlot||!selectedUpg)return;
  if(!navigator.onLine){toast('No internet connection','err');return;}const btn=$('confirm-install');btn.disabled=true;btn.innerHTML='<div class="spinner"></div>';
  try{await doInstallPart(c,sheetSlot.name,selectedUpg.name,selectedUpg.url);navigator.vibrate?.(30);closeSheet();toast('Installed: '+selectedUpg.name);}
  catch(e){navigator.vibrate?.([40,20,40]);toast(e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Install ✓';}});

/* ── Add (append to ## Wishlist) ── */
const doAdd=async(c,name,url,notes)=>{const newLine='- [ ] '+(url?'['+name+']('+url+')':name)+(notes?' — '+notes:'');
  const commit=async(sha,current)=>{const next=injectLine(current,newLine);const res=await ghPut(c,PARTS_PATH,next,sha,'add: '+name);
    setCache(res.content.sha,next);if(catalogLoaded)buildViews(next);};
  const cached=getCache();if(cached){try{await commit(cached.sha,cached.content);return;}catch(e){if(!e.conflict)throw e;clearCache();}}
  const raw=await ghGet(c,PARTS_PATH);const current=decode(raw.content);setCache(raw.sha,current);await commit(raw.sha,current);};

/* ── Web Share Target ── */
const sp=new URLSearchParams(location.search);
const sharedUrl=sp.get('url')||sp.get('text')||'';const sharedTitle=cleanTitle(sp.get('title')||'');const fromShare=!!sharedUrl;

/* ── Boot ── */
renderCats();renderSubs(false);renderHist();
if(sharedUrl)$('url').value=sharedUrl;
if(sharedTitle)$('name').value=sharedTitle;
if(!getToken())openTok();
if(fromShare)setTimeout(()=>$('name').focus(),300);

const syncOnline=()=>document.body.classList.toggle('offline',!navigator.onLine);
window.addEventListener('online',syncOnline);window.addEventListener('offline',syncOnline);syncOnline();

const addBtn=$('btn-add');
const handleAdd=async()=>{const name=$('name').value.trim(),url=$('url').value.trim(),notes=$('notes').value.trim();
  if(!name){$('name').focus();toast('Part name is required','err');return;}
  const c=getCfg();if(!c){openTok();return;}if(!navigator.onLine){toast('No internet connection','err');return;}
  addBtn.disabled=true;addBtn.innerHTML='<div class="spinner"></div> Adding…';
  try{await doAdd(c,name,url,notes);navigator.vibrate?.(30);pushHist({name,url,cat:activeCat,sub:curSub()});renderHist();
    if(fromShare){$('success-name').textContent=name;$('success-cat').textContent='Added to Wishlist';$('success-overlay').classList.add('show');setTimeout(()=>history.back(),1500);}
    else{toast('Added to Wishlist');$('url').value='';$('name').value='';$('notes').value='';
      notesOpen=false;notesArea.classList.remove('open');notesToggle.classList.remove('open');$('name').focus();}}
  catch(e){navigator.vibrate?.([60,40,60]);toast(e.message,'err');}finally{addBtn.disabled=false;addBtn.textContent='Add to list';}};
addBtn.addEventListener('click',handleAdd);
$('url').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('name').focus();}});
['name','notes'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleAdd();}}));

if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js');
</script>
</body>
