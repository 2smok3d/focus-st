name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  digital-garage:
    name: digital-garage tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: digital-garage/requirements.txt

      - name: Install dependencies
        working-directory: digital-garage
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: digital-garage
        run: python -m pytest tests/ -q

  garage-json:
    name: validate garage.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate published snapshot
        run: python .github/scripts/validate_garage_json.py
