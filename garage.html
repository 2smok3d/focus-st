<style>
:root{
  --bg:#0a0a0b; --bg2:#101014; --panel:#141419; --panel2:#1a1a21;
  --line:#26262f; --line2:#33333f;
  --ink:#e8e8ee; --ink2:#9a9aa8; --ink3:#6a6a78;
  --red:#e8000d; --red2:#ff2b38; --amber:#ffb020; --green:#35c46a; --blue:#3aa0ff;
  --disp:'Chakra Petch',ui-sans-serif,system-ui,'Arial Narrow',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  --body:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --nav:76px; --side:230px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(900px 500px at 78% -10%,rgba(232,0,13,.14),transparent 60%),
   radial-gradient(700px 500px at -5% 110%,rgba(58,160,255,.06),transparent 60%),
   linear-gradient(0deg,var(--bg),var(--bg));}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(circle at 70% 0%,#000,transparent 75%);}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;letter-spacing:.01em;margin:0}
.mono{font-family:var(--mono)}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}

/* layout */
.wrap{position:relative;z-index:1;display:flex;min-height:100vh}
aside{position:fixed;left:0;top:0;bottom:0;width:var(--side);border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(20,20,25,.9),rgba(10,10,11,.9));backdrop-filter:blur(8px);
  padding:22px 16px;display:flex;flex-direction:column;gap:6px;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 20px;border-bottom:1px solid var(--line);margin-bottom:14px}
.badge{width:38px;height:38px;border-radius:9px;background:#000;border:1px solid var(--line2);
  display:grid;place-items:center;font-family:var(--disp);font-weight:700;color:var(--red);font-size:16px;
  box-shadow:0 0 0 1px rgba(232,0,13,.25),0 6px 18px rgba(232,0,13,.18)}
.brand b{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.04em;display:block;line-height:1}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase}
nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--ink2);
  font-size:14px;font-weight:500;border:1px solid transparent;transition:.16s;cursor:pointer}
nav a .ic{width:18px;text-align:center;font-size:14px;opacity:.85}
nav a:hover{background:var(--panel);color:var(--ink);border-color:var(--line)}
nav a.on{background:linear-gradient(90deg,rgba(232,0,13,.16),rgba(232,0,13,.03));color:#fff;border-color:rgba(232,0,13,.35)}
nav a.on .ic{color:var(--red)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--ink3);line-height:1.7}
.side-foot a{color:var(--ink2);border-bottom:1px dotted var(--line2)}

main{margin-left:var(--side);flex:1;min-width:0;padding:34px clamp(18px,4vw,54px) 90px}
section.view{display:none;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
section.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.10s}.stagger>*:nth-child(4){animation-delay:.14s}
.stagger>*:nth-child(5){animation-delay:.18s}.stagger>*:nth-child(6){animation-delay:.22s}
.stagger>*:nth-child(7){animation-delay:.26s}.stagger>*:nth-child(8){animation-delay:.30s}

/* header block */
.head{margin-bottom:26px}
.head .tag{display:block;margin-bottom:8px}
.head h1{font-size:clamp(26px,4vw,40px);line-height:1.02;letter-spacing:.01em}
.head p{color:var(--ink2);max-width:70ch;margin:10px 0 0}

/* hero */
.hero{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:linear-gradient(120deg,var(--panel),var(--bg2) 70%);padding:28px;margin-bottom:22px}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:340px;height:340px;
  background:radial-gradient(circle,rgba(232,0,13,.22),transparent 60%);pointer-events:none}
.brk{position:absolute;width:16px;height:16px;border:2px solid var(--red);opacity:.7}
.brk.tl{top:12px;left:12px;border-right:0;border-bottom:0}.brk.tr{top:12px;right:12px;border-left:0;border-bottom:0}
.brk.bl{bottom:12px;left:12px;border-right:0;border-top:0}.brk.br{bottom:12px;right:12px;border-left:0;border-top:0}
.hero h2{font-size:clamp(24px,3.5vw,34px);letter-spacing:.02em}
.hero .vin{font-family:var(--mono);color:var(--red2);font-size:13px;letter-spacing:.22em;margin-top:6px}
.hero .sub{color:var(--ink2);font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;margin-top:4px}

/* grids & cards */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;transition:.18s}
.card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.tile .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.tile .v{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.1;margin-top:8px}
.tile .n{color:var(--ink2);font-size:12.5px;margin-top:3px}
.tile .v .u{font-size:13px;color:var(--ink3);font-family:var(--mono);font-weight:500}

/* section titles */
.sect{display:flex;align-items:baseline;gap:12px;margin:30px 0 14px}
.sect .num{font-family:var(--mono);color:var(--red);font-size:12px;letter-spacing:.1em}
.sect h3{font-size:19px;letter-spacing:.03em}
.sect .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

/* status */
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.s-good{background:var(--green);box-shadow:0 0 8px rgba(53,196,106,.6)}
.s-warn{background:var(--amber);box-shadow:0 0 8px rgba(255,176,32,.6)}
.s-crit{background:var(--red2);box-shadow:0 0 10px rgba(255,43,56,.7);animation:pulse 1.6s infinite}
.s-off{background:var(--ink3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  padding:4px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink2);white-space:nowrap}

/* systems grid */
.sys{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--panel);border:1px solid var(--line);border-radius:11px}
.sys .nm{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.02em}
.sys .ds{font-size:12px;color:var(--ink2);margin-top:1px}
.sys .r{margin-left:auto;text-align:right}

/* project cards */
.proj{position:relative;overflow:hidden}
.proj .letter{position:absolute;right:14px;top:8px;font-family:var(--disp);font-weight:700;font-size:52px;color:#fff;opacity:.05}
.proj h4{font-size:16.5px;letter-spacing:.02em;display:flex;align-items:center;gap:9px}
.proj .meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.proj .desc{color:var(--ink2);font-size:13.5px}
.proj .cost{font-family:var(--mono);color:var(--green);font-size:13px}
.bar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2))}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--line2)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.015)}
.tbl-wrap{border:1px solid var(--line);border-radius:13px;overflow:hidden;overflow-x:auto}
td .mono,.mono-td{font-family:var(--mono)}
.kv{display:grid;grid-template-columns:180px 1fr;gap:0}
.kv>div{padding:11px 14px;border-bottom:1px solid var(--line)}
.kv .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);background:var(--bg2)}
.kv .v{color:var(--ink)}

/* chart */
.chart{display:flex;flex-direction:column;gap:11px}
.crow{display:grid;grid-template-columns:150px 1fr 90px;align-items:center;gap:12px}
.crow .cl{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.ctrack{height:22px;border-radius:6px;background:var(--panel2);overflow:hidden;position:relative}
.ctrack>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,rgba(232,0,13,.85),var(--red2))}
.crow .cv{font-family:var(--mono);font-size:12px;color:var(--ink);text-align:right}

/* KB */
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px;background:var(--panel)}
.acc>summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:12px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .n{font-family:var(--mono);color:var(--red);font-size:12px;width:26px}
.acc>summary h4{font-size:15px}
.acc>summary .chev{margin-left:auto;color:var(--ink3);transition:.2s}
.acc[open]>summary .chev{transform:rotate(90deg)}
.acc .body{padding:0 18px 18px 56px;color:var(--ink2);font-size:13.5px}
.acc .body a{color:var(--blue);border-bottom:1px solid rgba(58,160,255,.3)}
.search{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:11px;color:var(--ink);
  font-family:var(--mono);font-size:13px;padding:12px 15px;margin-bottom:16px}
.search::placeholder{color:var(--ink3)}
.search:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(232,0,13,.15)}

.note{border-left:2px solid var(--red);background:rgba(232,0,13,.06);padding:12px 15px;border-radius:0 10px 10px 0;
  font-size:13.5px;color:var(--ink2);margin:14px 0}
.note b{color:var(--ink)}
.linkrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.lnk{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line2);border-radius:10px;
  font-family:var(--mono);font-size:12px;color:var(--ink2);transition:.16s}
.lnk:hover{border-color:var(--red);color:#fff}

/* mobile */
.mtop{display:none}
@media(max-width:860px){
  :root{--side:0px}
  aside{transform:translateX(-100%);transition:.25s;width:250px;--side:250px}
  aside.open{transform:none}
  main{margin-left:0;padding:16px 16px 96px}
  .mtop{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:15;margin:-16px -16px 14px;
    padding:12px 16px;background:rgba(10,10,11,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .burger{width:40px;height:40px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);color:var(--ink);font-size:18px}
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .kv{grid-template-columns:120px 1fr}
  .crow{grid-template-columns:96px 1fr 68px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19;display:none}
  .scrim.on{display:block}
}
@media(max-width:520px){.g4{grid-template-columns:1fr}}
</style>
</head>

function views(){

 V.costs=`

  <div class="note">Receipts auto-log to the FOST Receipts Log via a Gmail Apps Script (hourly scan). IFTTT can't watch Gmail, so the native script is the pipeline.</div>`;

 /* REFERENCE */
 V.reference=`
  <div class="head"><span class="tag">Section · Tools</span><h1>Reference</h1>

    <a class="lnk" target="_blank" href="https://docs.google.com/spreadsheets/d/1Y5lDZIvOPDb0Lnn6e575NiTVaS0s_MPTd4s1nyWj_Bw">↗ Receipts Log</a>
  </div>`;
 return V;
}

const app=document.getElementById("app"), navEl=document.getElementById("nav");
const V=views();
navEl.innerHTML=NAV.map((n,i)=>`<a data-v="${n[0]}" class="${i===0?'on':''}"><span class="ic">${n[1]}</span>${n[2]}</a>`).join("");
app.innerHTML=NAV.map((n,i)=>`<section class="view ${i===0?'on':''}" id="v-${n[0]}">${V[n[0]]}</section>`).join("");

function go(v){
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  document.getElementById("mtitle").textContent=(NAV.find(n=>n[0]===v)[2]||"").toUpperCase();
  window.scrollTo({top:0,behavior:"instant"});
  closeSide();
}
navEl.addEventListener("click",e=>{const a=e.target.closest("a");if(a)go(a.dataset.v);});

/* KB search */
app.addEventListener("input",e=>{
  if(e.target.id!=="kbsearch")return;const q=e.target.value.toLowerCase();
  document.querySelectorAll("#kblist .acc").forEach(d=>{d.style.display=d.dataset.t.includes(q)?"":"none";});
});

/* mobile */
const side=document.getElementById("side"),scrim=document.getElementById("scrim");
function closeSide(){side.classList.remove("open");scrim.classList.remove("on");}
document.getElementById("burger").onclick=()=>{side.classList.toggle("open");scrim.classList.toggle("on");};
scrim.onclick=closeSide;
</script>
